{% load static %}
<!doctype html>
<html lang ="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block  title %}買い物リスト メインページ{% endblock %}</title>
    <link rel="stylesheet" href ="{% static '/bootstrap-5.3.0-dist/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static '/style.css' %}">
    <link rel="stylesheet" href="{% static '/bootstrap-5.3.0-dist/css/style.css' %}"> 

</head>
<body>
    <nav class="navbar custom-navbar">
        <div class="container">
            <a href="." class="navbar-brand"> B-1 team shopping </a>
            {% if user.is_authenticated %}
            <a href="{% url 'accounts:logout' %}" class="btn btn-primary">Logout</a> 
            {% else %}
            <p>guest</p>
            {% endif %}
        </div>
    </nav>
    <div class="container" style="margin-top: 100px;">
        {% block main %}
            <h2> メインコンテンツが読み込まれていません </h2>
        {% endblock %}        
    </div>
</body>
</html>
